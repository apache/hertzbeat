# This is the configuration file for mcp-bash-server

[settings]
# Port for MCP Server deployment
port = 4000
# IP for MCP Server deployment
host = "127.0.0.1"
# Usage environment for MCP Server, can be development or production environment.
# Set env to "development" or "production", production uses oauth2.0.
env = "production"

# Only fixed, parameterless diagnostics are available.
# General command, script, and Python execution has been removed.
# Legacy [whitelist] and [blacklist] sections are ignored; they cannot restore
# removed tools or change the fixed diagnostic commands.
