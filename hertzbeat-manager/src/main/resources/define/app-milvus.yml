      url: '/metrics'
      timeout: ^_^timeout^_^
      method: GET
      parseType: prometheus

  # ---- Priority 9: RootCoord partition total ----
  - name: milvus_rootcoord_partition_num
    i18n:
      zh-CN: 根节点分区总数
      en-US: RootCoord Partition Count
      ja-JP: ルートコーディネーターパーティション数
    priority: 9
    fields:
      - field: value
        type: 0
        label: true
        i18n:
          zh-CN: 分区数
          en-US: Partition Count
          ja-JP: パーティション数
    protocol: http
    http:
      host: ^_^host^_^
      port: ^_^port^_^
      url: '/metrics'
      timeout: ^_^timeout^_^
      method: GET
      parseType: prometheus

  # ---- Priority 10: RootCoord DML request count ----
  - name: milvus_rootcoord_dml_req_count
    i18n:
      zh-CN: 根节点DML请求数
      en-US: RootCoord DML Request Count
      ja-JP: ルートコーディネーターDMLリクエスト数
    priority: 10
    fields:
      - field: status
        type: 1
        label: true
        i18n:
          zh-CN: 状态
          en-US: Status
          ja-JP: ステータス
      - field: value
        type: 0
        i18n:
          zh-CN: 请求数
          en-US: Request Count
          ja-JP: リクエスト数
    protocol: http
    http:
      host: ^_^host^_^
      port: ^_^port^_^
      url: '/metrics'
      timeout: ^_^timeout^_^
      method: GET
      parseType: prometheus

  # ---- Priority 11: RootCoord DDL request count ----
  - name: milvus_rootcoord_ddl_req_count
    i18n:
      zh-CN: 根节点DDL请求数
      en-US: RootCoord DDL Request Count
      ja-JP: ルートコーディネーターDDLリクエスト数
    priority: 11
    fields:
      - field: status
        type: 1
        label: true
        i18n:
          zh-CN: 状态
          en-US: Status
          ja-JP: ステータス
      - field: value
        type: 0
        i18n:
          zh-CN: 请求数
          en-US: Request Count
          ja-JP: リクエスト数
    protocol: http
    http:
      host: ^_^host^_^
      port: ^_^port^_^
      url: '/metrics'
      timeout: ^_^timeout^_^
      method: GET
      parseType: prometheus
