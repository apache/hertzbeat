    api: /api/account/auth/form
    method: POST
    header:
      Content-type: application/json
    body: |
      {
        "type": 0,
        "identifier": "admin",
        "credential": "hertzbeat"
      }
  expect:
    bodyFieldsExpect:
      code: "0"
- name: login-missing-content-type
  request:
    api: /api/account/auth/form
    method: POST
    body: |
      {
        "type": 0,
        "identifier": "admin",
        "credential": "hertzbeat"
      }
  expect:
    statusCode: 500
