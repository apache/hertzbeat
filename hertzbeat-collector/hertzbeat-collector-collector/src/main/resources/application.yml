server:
  port: 1159
  shutdown: graceful
  tomcat:
    threads:
      min-spare: 1
spring:
  application:
    name: ${HOSTNAME:@hertzbeat-collector@}${PID}
  profiles:
    active: cluster
  lifecycle:
    timeout-per-shutdown-phase: 10s
  jackson:
    default-property-inclusion: ALWAYS
management:
  endpoints:
    web:
      exposure:
        include:
          - 'prometheus'
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  prometheus:
    metrics:
      export:
        enabled: true
---
spring:
  config:
    activate:
      on-profile: cluster

collector:
  info:
    version: ${COLLECTOR_VERSION:1.9.0}
    ip: ${COLLECTOR_IP:}
  dispatch:
    entrance:
      netty:
        enabled: true
        # Config the collector unique identity name.
        identity: ${IDENTITY:}
        # Config the running mode(public or private), public cluster or private cloud-edge.
        mode: ${MODE:public}
        manager-host: ${MANAGER_HOST:}${MANAGER_IP:}
        manager-port: ${MANAGER_PORT:1158}
        authentication:
          # Required by default. Set optional explicitly only during a mixed-version rolling upgrade.
          mode: ${CLUSTER_AUTH_MODE:required}
          active-key-id: ${CLUSTER_AUTH_ACTIVE_KEY_ID:primary}
          # Leave empty to derive a domain-separated key from common.secret.
          active-secret: ${CLUSTER_AUTH_ACTIVE_SECRET:}
          previous-key-id: ${CLUSTER_AUTH_PREVIOUS_KEY_ID:}
          previous-secret: ${CLUSTER_AUTH_PREVIOUS_SECRET:}
          max-clock-skew: ${CLUSTER_AUTH_MAX_CLOCK_SKEW:5m}
          handshake-timeout: ${CLUSTER_AUTH_HANDSHAKE_TIMEOUT:3s}

push:
  uri: "127.0.0.1:1157"


common:
  # Use the same key as Manager. Inject it through deployment configuration, never over Netty.
  secret: ${COMMON_SECRET:}
  queue:
    type: netty

hertzbeat:
  collector:
    mysql:
      # MySQL-compatible query engine routing for MySQL, MariaDB, OceanBase, and TiDB SQL metrics.
      # auto  : prefer JDBC only when mysql-connector-j is available from ext-lib, otherwise use the built-in query engine
      # jdbc  : always use JDBC
      # r2dbc : always use the built-in query engine
      query-engine: ${HERTZBEAT_COLLECTOR_MYSQL_QUERY_ENGINE:auto}
  # Optional virtual-thread overrides. Remove this whole block to use built-in defaults.
  vthreads:
    enabled: true
    common:
      mode: UNBOUNDED_VT
    collector:
      mode: LIMIT_AND_REJECT
