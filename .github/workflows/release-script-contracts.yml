name: Release script contracts
on:
  workflow_dispatch:
  push:
    branches: [1.9.x-dev]
    paths:
      - 'script/assembly/**'
      - 'script/docker/**'
      - 'script/tests/**'
      - '.github/workflows/release-script-contracts.yml'
  pull_request:
    branches: [1.9.x-dev]
    paths:
      - 'script/assembly/**'
      - 'script/docker/**'
      - 'script/tests/**'
      - '.github/workflows/release-script-contracts.yml'
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ownership-aware readiness utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof iproute2 net-tools
          command -v lsof
          command -v ss
          netstat --version
      - name: Verify mandatory launcher and real Linux utility contracts
        run: HERTZBEAT_REQUIRE_REAL_READINESS=1 python3 -m unittest discover -s script/tests -v
