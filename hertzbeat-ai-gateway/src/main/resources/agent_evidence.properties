request.last15=(?:last\\s+(?:15|fifteen)\\s+minutes|(?:最近|过去|近)\\s*(?:15|十五)\\s*分钟)
request.cross=(?:cross[- ]signal|跨信号|指标.{0,20}日志.{0,20}链路)
title=Verified observations
scope=Attributes apply to returned rows only; totals do not verify unseen rows.
unknownStatus=Unknown or unset status does not verify success, even when the observed error count is zero.
snapshot=No verified absolute query window; treat as a snapshot or unverified temporal coverage.
coverage=Signal coverage (tool success is not full coverage)
limits=Only the listed query scope and returned records are verified. Empty results do not establish health. Cross-signal identity and causality are not established by this report.
logsNotQueried=Logs were NOT_QUERIED. Tool availability was not determined; discover logs tools before claiming capability is absent.
next=Next checks: query remaining pages within the same scope; verify unknown trace status; discover and query logs for the same object and window where authorized.
request.logs=(?:\\blogs?\\b|日志)
logCoverageIncomplete=PARTIAL: The requested log signal was not successfully queried. Capability is not established; see the retained evidence report.

request.metrics=(?:\\bmetrics?\\b|指标)
request.traces=(?:\\btraces?\\b|链路)
request.monitorFull=(?:all\\s+monitors|(?:full|complete)\\s+monitor\\s+(?:overview|inventory)|所有监控|全部监控|完整(?:的)?监控(?:概览|清单))
request.monitorCap=(?:(?:at\\s+most|up\\s+to|max(?:imum)?)\\s*\\d+\\s*monitors?|(?:最多|不超过)\\s*(?:[0-9]+|[一二三四五六七八九十]+)\\s*(?:个)?监控)
coverageIncomplete=PARTIAL: Requested scope remains incomplete; missing signals/pages follow. See retained tool records and specific unavailability reasons:
noMetricSeries=The metric inventory is empty in this object and time window; no metric name is available for a data query. This does not establish health or absent metric capability.
truncated=The result is truncated; complete coverage is unverified.

request.monitorPageCap=(?:(?:at\\s+most|up\\s+to|max(?:imum)?)?\\s*\\d+\\s*monitors?\\s+per\\s+page|per\\s+page\\s*(?:at\\s+most|up\\s+to|max(?:imum)?)?\\s*\\d+\\s*monitors?|(?:每页|单页)\\s*(?:最多|不超过)?\\s*(?:[0-9]+|[一二三四五六七八九十]+)\\s*(?:个)?监控)
unavailable=The tool reports this scope unavailable; retain its reason without inferring absent platform capability.

request.platformMonitorAlert=(?:\\bmonitors?\\s*(?:/|,|and)\\s*alerts?\\b|监控\\s*(?:/|、|和|与)\\s*告警)

request.toolBudget=(?:\\b(?:at most|up to|max(?:imum)?)\\s+(\\d+)\\s+tool\\s+calls?\\b|(?:最多|不超过)\\s*(\\d+)\\s*次工具调用)

