COMPLETE=原始任务已完成。
NEEDS_INPUT=原始任务还需要补充信息才能继续。
PLANNED=已提供计划，但尚未执行请求的操作。
NOT_EXECUTED=请求的任务尚未完成。工具发现或查询结果不能证明请求的操作已经执行。
WAITING_APPROVAL=请求的任务正在等待审批，尚未完成。
PARTIAL=请求的任务仅部分完成。已执行的操作已保留，其余操作尚未验证。
FAILED=请求的任务执行失败或被拒绝，尚未完成。
RECOVERY_REQUIRED=变更结果不确定或尚未验证。为避免重复变更，已停止自动重试。
UNKNOWN=无法验证原始任务或最终答复，不声明任务已完成。
checkpointMismatch=保存的任务目标与原始请求不一致，未开始任何变更。
checkpointUnavailable=原始任务目标未能持久化，未开始应用变更。
goalUnverified=无法核验原始应用任务，未开始任何变更。
goalMismatch=拟执行的应用变更与原始任务或精确资源ID不一致，未开始任何变更。
verificationBudget=剩余工具预算不足以同时执行请求的变更及精确回查，未开始新的变更。
batchPlanRequired=批量监控任务需要先保存完整、唯一且不含凭据的条目计划。请提供网站地址和采集间隔，或使用原生编辑页面；未开始新的变更。
batchStopped=批量监控任务已停止，已保存条目进度和原始预算，未开始额外写入。
mutationAlreadyRecorded=本任务已保存该应用变更的回执，已保留进度，未重复执行写入。
duplicateToolCall=工具调用标识重复或无效，未执行这次调用。已保留现有进度和原始预算。
batchFinished=已核对全部 {1} 个冻结的监控任务条目，整批任务已完成。
batchSegmentProgress=已核对 {0}/{1} 个冻结的监控任务条目，剩余 {2} 个。本段已在原预算内停止，需明确继续才能处理剩余条目。
batchNeedsReview=已核对 {0}/{1} 个冻结的监控任务条目，部分结果仍需人工核对；未重复任何结果不明的写入。
batchContinueRequest=仅继续冻结的监控批量任务中尚未执行的条目。
batchReconcileRequest=只读核对批量任务中结果不明的条目，不重复任何写入。
goalReview.REQUEST_TOO_LARGE=当前请求及引用上下文超出目标核验范围，未执行这一步应用变更。
goalReview.REVIEW_UNAVAILABLE=当前模型不支持目标核验，未执行这一步应用变更。
goalReview.MODEL_BUDGET_EXHAUSTED=本次运行的模型调用预算已用尽，无法核验应用目标；未执行这一步应用变更。
goalReview.CALL_FAILED=目标核验的模型调用失败，未执行这一步应用变更。
goalReview.CALL_TIMEOUT=目标核验的模型调用超时，未执行这一步应用变更。
goalReview.EMPTY_RESPONSE=目标核验未返回结构化目标，未执行这一步应用变更。
goalReview.UNEXPECTED_RESPONSE=目标核验返回了非预期的响应类型，未执行这一步应用变更。
goalReview.MALFORMED_RESPONSE=无法解析目标核验的响应格式，未执行这一步应用变更。
goalReview.INVALID_GOAL=目标核验的字段未通过校验，未执行这一步应用变更。

batchPreflightFailed=已核验 {0}/{1} 个监控条目；{2} 个未通过原生预检，未创建。其他可执行条目已处理。请先解决失败目标的可用性，再明确重试失败项。 错误码：{3}。

batchReplayed=已重放原请求：{0}/{1} 项通过既有回执核验，{2} 项仍未解决或预检失败。未新建监控，也未重试失败的预检。 错误码：{3}。

batchReplayNeedsInput=无法恢复原批次的完整条目与幂等键。请先读取原批次计划，或提供完全相同的原始 JSON；本次未执行创建或重试。

definitionSaved=已保存模板 {0}；已核验原生版本 {1} 与完整草稿内容。本次未创建监控实例，该回执不代表采集状态正常。

batchReadReceipts=只读核验既有批次回执：{0}/{1} 项已核验，失败 {2} 项，待处理 {3} 项，不确定 {4} 项。监控 ID：{5}。本轮未执行写入，此结果不代表原创建任务全部成功。

instrumentationBlocked=接入检查受阻：{0}。这些检查未应用接入指南，也未确认信号到达。请先配置可用的原生接入入口，再继续接入流程。

grafanaSaved=已保存监控 {1} 的 Grafana 仪表盘 {0}，原生版本 {2}；已通过独立回读核验请求字段。尚未验证页面渲染或数据源健康。
grafanaDeleted=已解除监控 {1} 的 Grafana 本地关联 {0}。远端删除回执：{2}。旧版远端 DELETE 不支持原子版本前置条件。
grafanaRemoteDeleted=已删除并独立核验不存在
grafanaRemoteNotDeleted=本次操作未删除远端仪表盘
grafanaBlocked=尚未执行 Grafana 操作（{0}）。请在原生集成或安全编辑器完成配置或处理不支持的内容；未创建或修改凭据。
grafanaNoWriteFailure=Grafana 在写入前拒绝了操作（{0}），未开始新的变更。
grafanaUnverifiedFailure=无法核验 Grafana 操作结果（{0}），原生资源可能已经改变。已停止自动重试，请先在原生编辑器核对准确的监控关联与 UID。

labelVerified=已通过原生回读核验标签操作：{0}，标签 ID：{1}。

noticeVerified=已通过原生回读核验通知配置操作：{0}，ID：{1}。此结果不代表通知已投递。

configurationVerified=已通过原生回读核验应用配置操作：{0}，ID：{1}。

collectionVerified=已按批准计划完成一次采集：监控 {0}，计划 {1}。未启用周期采集，也未更改监控配置。

websitePlanNeedsInput=无法形成符合原始请求的完整网站监控计划。请确认缺失或冲突的条件；尚未开始任何变更。
websiteSelectionLimit=候选规划已达到本轮上限：已保留 {0}/{1} 个未重复目标，仍缺 {2} 个，累计检查 {3} 个候选。尚未探测或创建监控。本次不完整计划不能批准或继续；可重新发起完整选站计划。
websiteReviewProtocolInvalid=网站候选列表已生成，但独立审核未返回有效的结构化结果（WEBSITE_PROPOSAL_REVIEW_INVALID）。尚未进入创建审批，未创建监控。请检查模型的结构化输出。
websiteCandidateOverflowNotice=候选规划：本轮收到 {0} 个建议，完成 {1} 个候选的元数据核对。以下 {2} 个超额候选未进行元数据核对：{3}。尚未探测或创建监控。
websiteNoNewCandidates=本次补选未提供新候选（WEBSITE_PROPOSAL_NO_NEW_CANDIDATES）。已保留 {0}/{1}，仍缺 {2}，累计核对 {3} 个，剩余名额 {4} 个。尚未进入创建审批或执行。
websiteSelectionRoundLimit=本轮两次补选或纠错机会已用完（WEBSITE_PROPOSAL_SUPPLEMENT_ROUND_LIMIT）。已保留 {0}/{1}，仍缺 {2}，累计核对 {3} 个，剩余名额 {4} 个。尚未进入创建审批或执行。
websiteSelectionAccountingUnavailable=候选计数或规划记录未能核验。尚未进入创建审批或执行。

websiteExclusionsUnavailable=WEBSITE_EXCLUSIONS_UNAVAILABLE：无法读取完整且授权的网站排除名单。尚未批准计划或创建监控；请核对读取范围或大小限制后再发起计划。
