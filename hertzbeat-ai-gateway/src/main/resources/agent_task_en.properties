COMPLETE=The original task is complete.
NEEDS_INPUT=The original task needs more information before it can continue.
PLANNED=A plan is available, but the requested action has not been executed.
NOT_EXECUTED=The requested task has not been completed. Discovery or a query result does not prove that the requested action was executed.
WAITING_APPROVAL=The requested task is waiting for approval and has not completed.
PARTIAL=The requested task is only partially complete. Completed actions are retained; remaining actions have not been verified.
FAILED=The requested task failed or was denied. It has not completed.
RECOVERY_REQUIRED=A mutation result is uncertain or has not been verified. Automatic retry is stopped to avoid duplicate changes.
UNKNOWN=The original task or the final answer could not be verified. No task completion is claimed.
checkpointMismatch=The saved task goal does not match the original request; no mutation was started.
checkpointUnavailable=The original task goal could not be persisted; no application mutation was started.
goalUnverified=The original application task could not be verified; no mutation was started.
goalMismatch=The proposed application mutation differs from the original task or exact resource ids; no mutation was started.
verificationBudget=The remaining tool budget cannot cover both the requested mutation and its exact readback. No new mutation was started.
batchPlanRequired=A complete, unique, credential-free item plan for the original monitor task is required before any writes. Supply exact website URLs and intervals or use the native editor. No new changes were started.
batchStopped=The bounded monitor task has stopped. Its saved item progress and original budget are retained; no additional writes were started.
mutationAlreadyRecorded=The requested application change already has a saved receipt in this task. Its progress is retained; the write was not repeated.
duplicateToolCall=The tool-call identity is duplicated or invalid. This call was not executed; existing progress and the original budget are retained.
batchFinished=Verified {0} of {1} frozen monitor items. The batch is complete.
batchSegmentProgress=Verified {0} of {1} frozen monitor items; {2} remain. This segment stopped within its original budget. Continue explicitly to process the remaining items.
batchNeedsReview=Verified {0} of {1} frozen monitor items. Some outcomes still need review. No uncertain write was repeated.
batchContinueRequest=Continue only the remaining items of the frozen monitor batch.
batchReconcileRequest=Read-only reconciliation of uncertain batch outcomes; never repeat a write.
goalReview.REQUEST_TOO_LARGE=The request and referenced context are too large for target verification. This application change was not executed.
goalReview.REVIEW_UNAVAILABLE=The current model does not support target verification. This application change was not executed.
goalReview.MODEL_BUDGET_EXHAUSTED=The model-call budget for this run is exhausted, so the application target could not be verified. This application change was not executed.
goalReview.CALL_FAILED=The target-verification model call failed. This application change was not executed.
goalReview.CALL_TIMEOUT=The target-verification model call timed out. This application change was not executed.
goalReview.EMPTY_RESPONSE=Target verification returned no structured goal. This application change was not executed.
goalReview.UNEXPECTED_RESPONSE=Target verification returned an unexpected response type. This application change was not executed.
goalReview.MALFORMED_RESPONSE=The target-verification response could not be parsed. This application change was not executed.
goalReview.INVALID_GOAL=The target-verification fields did not pass validation. This application change was not executed.

batchPreflightFailed=Verified {0} of {1} monitor items; {2} failed native preflight and were not created. Other runnable items completed. Correct their availability before explicitly retrying failed items. Error codes: {3}.

batchReplayed=Replayed the original request: {0}/{1} items verified from existing receipts; {2} remain unresolved or preflight-failed. No new monitors were created and no failed preflight was retried. Error codes: {3}.

batchReplayNeedsInput=The complete original batch items and idempotency keys could not be restored. Read the original batch plan or resubmit its exact JSON. No create or retry was executed.

definitionSaved=Saved template {0}; native revision {1} and exact draft content were verified. No monitor instance was created; this receipt does not establish collection health.

batchReadReceipts=Read-only verification of existing batch receipts: {0}/{1} verified, {2} failed, {3} pending, {4} uncertain. Monitor IDs: {5}. This run performed no writes; the original create task is not thereby fully successful.

instrumentationBlocked=Instrumentation checks are blocked: {0}. These checks did not apply a guide or establish signal reception. Configure an available native intake before continuing onboarding.

grafanaSaved=Saved Grafana dashboard {0} for monitor {1}; native version {2}. Requested fields were verified by an independent readback. Rendering and datasource health were not tested.
grafanaDeleted=Removed the local Grafana binding {0} for monitor {1}. Remote deletion receipt: {2}. Legacy remote DELETE has no atomic version precondition.
grafanaRemoteDeleted=deleted and independently verified absent
grafanaRemoteNotDeleted=not deleted by this operation
grafanaBlocked=Grafana operation was not executed ({0}). Use the native integration or secure editor for setup or unsupported contents; no credentials were created or changed.
grafanaNoWriteFailure=Grafana rejected the operation before writing ({0}). No new change was started.
grafanaUnverifiedFailure=Grafana operation result cannot be verified ({0}). The native resource may have changed. Automatic retry is stopped; verify the exact binding and UID in the native editor.

labelVerified=Native readback verified label operation: {0}, label ID: {1}.

noticeVerified=Native readback verified notification configuration operation: {0}, ID: {1}. This does not prove notification delivery.

configurationVerified=Native readback verified application configuration operation: {0}, ID: {1}.

collectionVerified=Completed one collection for monitor {0} using approved plan {1}. No recurring collection was enabled and monitor configuration was unchanged.

websitePlanNeedsInput=A complete website proposal could not satisfy the original request. Clarify the missing or conflicting constraints; no change has started.

websiteSelectionLimit=Candidate selection stopped at this run limit: {0}/{1} new targets retained, {2} still needed after checking {3} candidates. No probe or monitor creation ran. This incomplete plan cannot be approved or continued; start a new complete selection plan.
websiteReviewProtocolInvalid=Website candidates were generated, but the independent review did not return a valid structured result (WEBSITE_PROPOSAL_REVIEW_INVALID). Creation approval has not started and no monitor was created. Check the model structured output.
websiteCandidateOverflowNotice=Candidate planning: received {0} suggestions and completed metadata checks for {1}. These {2} overflow suggestions did not receive metadata checks: {3}. No network probing or monitor creation has occurred.
websiteNoNewCandidates=No fresh candidates were supplied (WEBSITE_PROPOSAL_NO_NEW_CANDIDATES). Retained {0}/{1}; missing {2}; checked {3}; remaining candidate slots {4}. No creation approval or mutation started.
websiteSelectionRoundLimit=The two planning correction opportunities are exhausted (WEBSITE_PROPOSAL_SUPPLEMENT_ROUND_LIMIT). Retained {0}/{1}; missing {2}; checked {3}; remaining candidate slots {4}. No creation approval or mutation started.
websiteSelectionAccountingUnavailable=Candidate accounting or its planning notice could not be verified. No creation approval or mutation started.

websiteExclusionsUnavailable=WEBSITE_EXCLUSIONS_UNAVAILABLE: A complete authorized website exclusion set could not be read. No plan was approved or created; check the read scope or size limit before starting a new plan.
