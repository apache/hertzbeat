title=已验证观测（服务端事实）
scope=属性只适用于实际返回行；总数不能证明未返回记录的属性。
unknownStatus=未知或 unset 状态不能证明成功，即使已观测错误数为零。
snapshot=没有已验证的绝对查询窗口；仅为快照或时间覆盖尚未验证。
coverage=各信号实际覆盖（工具成功不代表全量覆盖）
limits=仅验证所列查询条件和实际返回记录。空结果不代表健康。本报告尚未建立跨信号身份绑定或因果关系。
logsNotQueried=日志未查询（NOT_QUERIED），不能据此认定没有日志能力；需先发现日志工具，再按授权范围查询。
next=下一步：在相同范围内补查剩余分页；核验未知链路状态；按授权发现并查询同一对象、同一窗口的日志。
logCoverageIncomplete=PARTIAL: 请求的日志信号尚未成功查询；不能据此认定没有日志能力。请查看已保留的事实报告。

request.metrics=(?:\\bmetrics?\\b|指标)
request.traces=(?:\\btraces?\\b|链路)
request.monitorFull=(?:all\\s+monitors|(?:full|complete)\\s+monitor\\s+(?:overview|inventory)|所有监控|全部监控|完整(?:的)?监控(?:概览|清单))
request.monitorCap=(?:(?:at\\s+most|up\\s+to|max(?:imum)?)\\s*\\d+\\s*monitors?|(?:最多|不超过)\\s*(?:[0-9]+|[一二三四五六七八九十]+)\\s*(?:个)?监控)
coverageIncomplete=PARTIAL: 请求范围尚未读完；缺少以下信号或分页。请参照已保留的工具记录与具体不可用原因：
noMetricSeries=所选对象和时间窗口的指标目录为空；没有可用于数据查询的指标名。不代表健康或平台不支持指标。
truncated=结果被截断，尚不能验证完整覆盖。

request.monitorPageCap=(?:(?:at\\s+most|up\\s+to|max(?:imum)?)?\\s*\\d+\\s*monitors?\\s+per\\s+page|per\\s+page\\s*(?:at\\s+most|up\\s+to|max(?:imum)?)?\\s*\\d+\\s*monitors?|(?:每页|单页)\\s*(?:最多|不超过)?\\s*(?:[0-9]+|[一二三四五六七八九十]+)\\s*(?:个)?监控)
unavailable=工具明确报告在当前范围内不可用；保留该原因，不代表无此平台能力。

request.platformMonitorAlert=(?:\\bmonitors?\\s*(?:/|,|and)\\s*alerts?\\b|监控\\s*(?:/|、|和|与)\\s*告警)

request.toolBudget=(?:\\b(?:at most|up to|max(?:imum)?)\\s+(\\d+)\\s+tool\\s+calls?\\b|(?:最多|不超过)\\s*(\\d+)\\s*次工具调用)

answer.count=目前共有 {0} 个监控。
answer.filteredCount=当前筛选范围内共有 {0} 个监控。
answer.statusCounts=当前筛选范围内共有 {0} 个监控：在线 {1} 个、离线 {2} 个、暂停 {3} 个、不可达 {4} 个。各状态是独立查询快照。
answer.incomplete=本次查询尚未完成，仍未核实：

answer.unsupportedWindow=这个监控查询接口只能查看当前快照，暂不能统计你指定的历史时间范围。

