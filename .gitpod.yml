# Hosted Gitpod execution is not validated for the HertzBeat 2.0 alpha.
# Use the local Java 25 / Node.js 22 source workflow in docs/alpha-preview.md.
tasks:
    - name: Unsupported preview environment
      command: |
          printf '%s\n' 'Gitpod is not validated for HertzBeat 2.0 alpha. Follow docs/alpha-preview.md for the supported local source workflow.' >&2
          exit 1

vscode:
    extensions:
        - vscjava.vscode-java-pack
        - editorconfig.editorconfig
        - dbaeumer.vscode-eslint
        - stylelint.vscode-stylelint
        - DavidAnson.vscode-markdownlint
        - ms-azuretools.vscode-docker
        - cweijan.vscode-database-client2
        - GitHub.vscode-pull-request-github
