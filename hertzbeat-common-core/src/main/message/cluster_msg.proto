syntax = "proto3";
package org.apache.hertzbeat.common.entity.message;

message Message
{
    // collector identity
    string identity = 1;
    // message direction
    Direction direction = 2;
    // message type
    MessageType type = 3;
    // message content
    bytes msg = 4;
    // sender timestamp used to reject stale messages
    int64 auth_timestamp = 5;
    // per-message random value used to reject replay
    bytes auth_nonce = 6;
    // HMAC-SHA256 over the message with this field cleared
    bytes auth_signature = 7;
    // authentication envelope version; zero identifies a legacy unsigned message
    uint32 auth_version = 8;
    // key identifier used for non-disruptive key rotation
    string auth_key_id = 9;
    // server-generated nonce binding a signed message to one Netty connection
    bytes auth_channel_nonce = 10;
}

enum MessageType
{
    // heartbeat message
    HEARTBEAT = 0;
    // collector go online to master message
    GO_ONLINE = 1;
    // collector go offline to master message
    GO_OFFLINE = 2;
    // collector go close to master
    GO_CLOSE = 3;
    // issue cyclic collect task
    ISSUE_CYCLIC_TASK = 4;
    // delete cyclic collect task
    DELETE_CYCLIC_TASK = 5;
    // issue one-time collect task
    ISSUE_ONE_TIME_TASK = 6;
    // response one-time collect data
    RESPONSE_ONE_TIME_TASK_DATA = 7;
    // response cyclic collect data
    RESPONSE_CYCLIC_TASK_DATA = 8;
    // response cyclic service discovery data
    RESPONSE_CYCLIC_TASK_SD_DATA = 9;
    // internal authentication capability and channel-binding challenge
    AUTH_CHALLENGE = 10;
}

enum Direction {
    // request message
    REQUEST = 0;
    // request response
    RESPONSE = 1;
}
