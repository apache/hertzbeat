## -- sureness.yml account source -- ##

# config the resource restful api that need auth protection, base rbac
# rule: api===method===role
# eg: /api/v1/source1===get===[admin] means /api/v2/host===post support role[admin] access.
# eg: /api/v1/source2===get===[] means /api/v1/source2===get can not access by any role.
resourceRole:
  - /h2-console/**===*===[admin]
  - /api/account/auth/refresh===post===[admin]
  - /api/apps/**===get===[admin]
  # the define yml routes persist the global collection templates
  # All template authoring operations are administrator-only.
  - /api/apps/**===post===[admin]
  - /api/apps/**===put===[admin]
  - /api/apps/**===delete===[admin]
  - /api/monitor/**===get===[admin]
  - /api/monitor/**===post===[admin]
  - /api/monitor/**===put===[admin]
  - /api/monitor/**===delete===[admin]
  - /api/monitors/**===get===[admin]
  - /api/monitors/**===post===[admin]
  - /api/monitors/**===put===[admin]
  - /api/monitors/**===delete===[admin]
  - /api/alert/**===get===[admin]
  - /api/alert/**===post===[admin]
  - /api/alert/**===put===[admin]
  - /api/alert/**===delete===[admin]
  - /api/alerts/**===get===[admin]
  - /api/alerts/**===post===[admin]
  - /api/alerts/**===put===[admin]
  - /api/alerts/**===delete===[admin]
  - /api/notice/**===get===[admin]
  - /api/notice/**===post===[admin]
  - /api/notice/**===put===[admin]
  - /api/notice/**===delete===[admin]
  - /api/tag/**===get===[admin]
  - /api/tag/**===post===[admin]
  - /api/tag/**===put===[admin]
  - /api/tag/**===delete===[admin]
  - /api/summary/**===get===[admin]
  - /api/summary/**===post===[admin]
  - /api/summary/**===put===[admin]
  - /api/summary/**===delete===[admin]
  - /api/collector/**===get===[admin]
  - /api/collector/**===post===[admin]
  - /api/collector/**===put===[admin]
  - /api/collector/**===delete===[admin]
  - /api/status/page/**===get===[admin]
  - /api/status/page/**===post===[admin]
  - /api/status/page/**===put===[admin]
  - /api/status/page/**===delete===[admin]
  - /api/grafana/**===get===[admin]
  - /api/grafana/**===post===[admin]
  - /api/grafana/**===put===[admin]
  - /api/grafana/**===delete===[admin]
  - /api/bulletin/**===get===[admin]
  - /api/bulletin/**===post===[admin]
  - /api/bulletin/**===put===[admin]
  - /api/bulletin/**===delete===[admin]
  - /api/sse/**===get===[admin]
  - /api/sse/**===post===[admin]
  - /api/chat/**===get===[admin]
  - /api/chat/**===post===[admin]
  - /api/ai/**===get===[admin]
  - /api/ai/**===post===[admin]
  - /api/ai/**===put===[admin]
  - /api/ai/**===delete===[admin]
  - /api/otlp/v1/**===post===[admin,user]
  # deprecated 1.8.x OTLP log aliases, forwarded to /api/otlp/v1/logs, removed in 2.0
  - /api/logs/otlp/**===post===[admin,user]
  - /api/logs/ingest/**===post===[admin,user]
  - /api/observability/logs===delete===[admin]
  - /api/observability/**===get===[admin]
  # The OpenAPI document is a map of every route, parameter and model, so it is
  # scoped like any other administrative resource instead of being anonymous
  - /v3/api-docs/**===get===[admin]
  - /v3/api-docs.yaml===get===[admin]
  - /v3/api-docs.yaml/**===get===[admin]
  - /v2/api-docs/**===get===[admin]
  - /swagger-resources/**===get===[admin]
  # the alert stream carries full alert payloads and the manager stream carries import
  # progress; both are scoped like the log stream above rather than left anonymous
  - /api/alert/sse/**===get===[admin]
  - /api/manager/sse/**===get===[admin]

# config the resource restful api that need bypass auth protection
# rule: api===method
# eg: /api/v1/source3===get means /api/v1/source3===get can be access by anyone, no need auth.
excludedResource:
  - /api/account/auth/**===*
  - /api/i18n/**===get
  - /api/apps/hierarchy===get
  - /api/push/**===*
  - /api/status/page/public/**===*
  # web ui resource
  - /===get
  - /assets/**===get
  - /dashboard/**===get
  - /monitors/**===get
  - /alert/**===get
  - /account/**===get
  - /setting/**===get
  - /passport/**===get
  - /status/**===get
  - /**/*.html===get
  - /**/*.js===get
  - /**/*.css===get
  - /**/*.ico===get
  - /**/*.ttf===get
  - /**/*.png===get
  - /**/*.gif===get
  - /**/*.jpg===get
  - /**/*.svg===get
  - /**/*.json===get
  - /**/*.woff===get
  - /**/*.eot===get

# account info config
# Management supports admin only. Existing non-admin accounts must be manually reviewed.
# Legacy user roles in ingestion rules above are machine-compatibility exceptions only.
account:
  - appId: admin
    credential: hertzbeat
    role: [admin]
  - appId: tom
    credential: hertzbeat
    role: [user]
  - appId: guest
    credential: hertzbeat
    role: [guest]
  - appId: lili
    # credential = MD5(password + salt)
    # plain password: hertzbeat
    # attention: digest authentication does not support salted encrypted password accounts
    credential: 94C6B34E7A199A9F9D4E1F208093B489
    salt: 123
    role: [user]
