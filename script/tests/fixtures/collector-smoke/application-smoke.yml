# Keep smoke networking on loopback; no live manager or remote target is required.
server:
  address: 127.0.0.1
collector:
  dispatch:
    entrance:
      netty:
        identity: ci-package-smoke
        manager-host: 127.0.0.1
        manager-port: 18558
# The packaged collector otherwise exposes only prometheus over HTTP.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read_only
