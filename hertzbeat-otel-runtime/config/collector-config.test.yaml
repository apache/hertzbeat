receivers:
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:
      network:
      paging:
      processes:
  prometheus/validation:
    config:
      scrape_configs:
        - job_name: validation
          scrape_interval: 30s
          static_configs:
            - targets: ['127.0.0.1:19464']
  filelog/validation:
    include:
      - ${env:HERTZBEAT_OTEL_TEST_LOG}
    start_at: end
    storage: file_storage
    max_log_size: 1MiB
    max_concurrent_files: 32

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: service.name
        value: hertzbeat-otel-runtime
        action: upsert
      - key: hertzbeat.collector.id
        value: ${env:HERTZBEAT_COLLECTOR_ID}
        action: upsert
      - key: hertzbeat.runtime
        value: otel
        action: upsert
      - key: hertzbeat.workspace_id
        value: ${env:HERTZBEAT_WORKSPACE_ID}
        action: upsert
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlphttp:
    endpoint: ${env:HERTZBEAT_OTLP_HTTP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:HERTZBEAT_OTLP_TOKEN}
    compression: gzip
    retry_on_failure:
      enabled: true

extensions:
  health_check:
    endpoint: 127.0.0.1:${env:HERTZBEAT_OTEL_HEALTH_PORT}
  file_storage:
    directory: ${env:HERTZBEAT_OTEL_FILE_STORAGE_DIR}

service:
  extensions: [health_check, file_storage]
  pipelines:
    metrics:
      receivers: [hostmetrics, prometheus/validation]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    logs:
      receivers: [filelog/validation]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
